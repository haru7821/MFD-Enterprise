name: Browser

# Separated from ci.yml on purpose. Installing a browser costs minutes; the
# typecheck / lint / unit gate should answer in under one, and does. This workflow
# runs alongside it rather than inside it, so a failing lint is reported in seconds
# and a failing browser test does not have to wait behind a browser download.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        # Only the one browser the suite targets, with its system dependencies.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # The specs run against a production build: React's development build would
        # make the rendering assertions measure the wrong thing.
        run: pnpm build

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
