<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` and no user scaling: the canvas handles its own pinch-to-zoom, and a
      browser zooming the whole page on top of that would leave the drawing at an unknown scale
      — which for a measuring tool is worse than not zooming at all.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="MFD-E — AI-assisted dialysis facility engineering platform" />

    <!-- Progressive Web App. Offline capability for projects is a later sprint; this is the app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1319" />

    <!--
      iPadOS ignores the manifest for home-screen installs and reads these instead, which is
      exactly why they are here: Safari on a tablet is a supported platform, not an afterthought.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MFD-E" />

    <title>MFD-E · Medical Layout Designer</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
